[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "language-logits-processor"
version = "0.1.0"
description = "Language-aware logits processor for vLLM — restrict model output to specified languages by Unicode range"
readme = "readme.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
